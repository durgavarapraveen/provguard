name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # release.sh runs go vet, go test and bench --check before it builds.
      - name: Vet, tests, benchmark and release files
        shell: bash
        run: bash scripts/release.sh 0.0.0-ci
      - name: End-to-end install test (Linux, macOS)
        if: runner.os != 'Windows'
        run: PROVGUARD_DIST=dist sh scripts/e2e.sh 0.0.0-ci
      - name: End-to-end install test (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PROVGUARD_DIST = (Resolve-Path dist).Path
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\e2e.ps1 -Version 0.0.0-ci
          exit $LASTEXITCODE
      - name: End-to-end install test (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PROVGUARD_DIST = (Resolve-Path dist).Path
          pwsh -NoProfile -File scripts/e2e.ps1 -Version 0.0.0-ci
          exit $LASTEXITCODE
